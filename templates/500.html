{% extends 'base.html' %}
{% load static %}
{% block title %}500 — Server Error | LancersPulse{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:60vh;">
  <div class="col-12 col-sm-10 col-md-7 col-lg-5 text-center">
    <div class="card border-0 shadow-sm p-4 p-md-5">
      <div class="card-body">
        <div class="widget-icon warning mx-auto mb-4" style="width:5rem;height:5rem;font-size:2.5rem;">
          <i class="bi bi-tools"></i>
        </div>
        <h1 class="display-4 fw-bold text-warning mb-1">500</h1>
        <h4 class="fw-semibold mb-3">Something went wrong</h4>
        <p class="text-muted mb-4">
          We hit an unexpected error on our end. The team has been notified.<br>
          Please try again in a moment.
        </p>
        <div class="d-flex flex-wrap justify-content-center gap-2">
          <a href="/" class="btn btn-primary">
            <i class="bi bi-house-door me-2"></i>Back to Home
          </a>
          <button onclick="window.history.back()" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-2"></i>Go Back
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
