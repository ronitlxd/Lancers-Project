{% extends 'base.html' %}
{% load static %}
{% block title %}Password Changed — LancersPulse{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:480px">
  <div class="card">
    <div class="card-body p-4 text-center">
      <div class="widget-icon success mx-auto mb-3"><i class="bi bi-check-circle-fill"></i></div>
      <h3 class="fw-bold mb-2">Password changed</h3>
      <p class="text-muted mb-4">
        Your password has been set successfully. You can now sign in with your new password.
      </p>
      <a href="{% url 'login' %}" class="btn btn-primary btn-lg">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign in
      </a>
    </div>
  </div>
</div>
{% endblock %}
